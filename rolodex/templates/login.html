{% extends "base.html" %}
{% block main %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Company password <input type="password" name="password" autofocus required></label>
    <button class="btn">Sign in</button>
  </form>
</section>
{% endblock %}
